name: billing-service

on:
  push:
    paths: ["services/billing/**", ".github/workflows/billing.yml"]
  pull_request:
    paths: ["services/billing/**"]

defaults:
  run:
    working-directory: services/billing

jobs:
  test:
    runs-on: ubuntu-latest # Docker is available, so Testcontainers works
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Compile and test (JUnit 5 + Testcontainers)
        run: mvn -B verify

  image:
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: repo
        run: echo "name=${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT" # image names must be lowercase
      - uses: docker/build-push-action@v6
        with:
          context: services/billing
          push: true
          tags: ghcr.io/${{ steps.repo.outputs.name }}/billing-service:latest
