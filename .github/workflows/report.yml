# Roda só quando mudam os arquivos deste serviço (ou este próprio arquivo), para não gastar minutos de CI à toa.
name: report-service

on:
  push:
    paths: ["services/report/**", ".github/workflows/report.yml"]
  pull_request:
    paths: ["services/report/**"]

defaults:
  run:
    working-directory: services/report

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: services/report/requirements-dev.txt
      - run: pip install -r requirements-dev.txt ruff
      - name: Lint (ruff)
        run: ruff check app tests
      - name: Test (pytest)
        run: pytest

  image:
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: repo
        run: echo "name=${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT" # image names must be lowercase
      - uses: docker/build-push-action@v7
        with:
          context: services/report
          push: true
          tags: ghcr.io/${{ steps.repo.outputs.name }}/report-service:latest
