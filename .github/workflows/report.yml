name: report-service

on:
  push:
    paths: ["services/report/**", ".github/workflows/report.yml"]
  pull_request:
    paths: ["services/report/**"]

defaults:
  run:
    working-directory: services/report

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: services/report/requirements-dev.txt
      - run: pip install -r requirements-dev.txt ruff
      - name: Lint (ruff)
        run: ruff check app tests
      - name: Test (pytest)
        run: pytest

  image:
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: services/report
          push: true
          tags: ghcr.io/${{ github.repository }}/report-service:latest
