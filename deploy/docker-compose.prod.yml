# Production-like stack for ONE small server (Oracle Cloud Always Free, or any Linux box with Docker).
#
# Differences from the root docker-compose.yml:
#   * Only Caddy is reachable from the internet (ports 80/443). It gives HTTPS and asks for a password.
#   * Databases, Kafka and the services stay on the private Docker network.
#   * The dashboard and the APIs share one address (same origin), so no CORS and one certificate.
#   * Memory limits for the JVMs, so everything fits in a few GB.
#
# Run from the repository root:
#   docker compose --env-file deploy/.env -f deploy/docker-compose.prod.yml up -d --build
name: billing-prod

services:
  caddy:
    image: caddy:2
    restart: unless-stopped
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:?set SITE_ADDRESS in deploy/.env}
      BASIC_USER: ${BASIC_USER:-visitante}
      BASIC_HASH: ${BASIC_HASH:?set BASIC_HASH in deploy/.env}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on: [dashboard, billing-service, report-service]

  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: billing
      POSTGRES_USER: billing
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-billing}
    volumes: [postgres-data:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U billing -d billing"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--maxmemory", "128mb"]
    volumes: [redis-data:/data]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  kafka:
    image: apache/kafka:3.8.0
    restart: unless-stopped
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: INTERNAL://:19092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:19092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_LOG_RETENTION_MS: -1
      KAFKA_NUM_PARTITIONS: 3
      KAFKA_HEAP_OPTS: -Xms384m -Xmx640m
    volumes: [kafka-data:/var/lib/kafka/data]
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:19092 > /dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 12

  kafka-ui:
    image: provectuslabs/kafka-ui:v0.7.2
    restart: unless-stopped
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:19092
      SERVER_SERVLET_CONTEXT_PATH: /kafka
      DYNAMIC_CONFIG_ENABLED: "false" # visitors cannot add clusters
      JAVA_OPTS: -Xmx320m
    depends_on:
      kafka: { condition: service_healthy }

  mailpit:
    image: axllent/mailpit:v1.33.1
    restart: unless-stopped
    environment:
      MP_WEBROOT: /mail

  billing-service:
    build: ../services/billing
    restart: unless-stopped
    ports: ["127.0.0.1:18080:8080"] # loopback only: used by the seed script on the server itself, not public
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/billing
      DB_USER: billing
      DB_PASSWORD: ${POSTGRES_PASSWORD:-billing}
      KAFKA_BOOTSTRAP: kafka:19092
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in deploy/.env}
      JAVA_TOOL_OPTIONS: -Xmx448m
      # The nightly job also runs every 10 minutes here, so the demo shows invoices becoming overdue soon after the seed.
      # It is idempotent: only OPEN invoices past the due date are touched.
      APP_OVERDUE_CRON: "0 */10 * * * *"
    depends_on:
      postgres: { condition: service_healthy }
      kafka: { condition: service_healthy } # the topics are created when this service starts

  notification-service:
    build: ../services/notification
    restart: unless-stopped
    environment:
      KAFKA_BOOTSTRAP: kafka:19092
      SMTP_HOST: mailpit
      SMTP_PORT: 1025
      DB_PATH: /app/data/notifications.db
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in deploy/.env}
    volumes: [notification-data:/app/data]
    depends_on:
      kafka: { condition: service_healthy }
      mailpit: { condition: service_started }

  report-service:
    build: ../services/report
    restart: unless-stopped
    ports: ["127.0.0.1:18000:8000"] # loopback only, for checks on the server
    environment:
      KAFKA_BOOTSTRAP: kafka:19092
      REDIS_URL: redis://redis:6379/0
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in deploy/.env}
    depends_on:
      kafka: { condition: service_healthy }
      redis: { condition: service_healthy }

  dashboard:
    build:
      context: ../web
      args:
        VITE_BACKEND: rest
        VITE_BILLING_URL: /api/billing
        VITE_REPORT_URL: /api/report
        VITE_NOTIFICATION_URL: /api/notification
    restart: unless-stopped

volumes:
  postgres-data:
  redis-data:
  kafka-data:
  notification-data:
  caddy-data:
  caddy-config:
