# One command to run everything:  docker compose up --build
# Only some pieces?  docker compose up postgres kafka billing-service
name: billing-platform

services:
  # ---------- infrastructure ----------
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: billing
      POSTGRES_USER: billing
      POSTGRES_PASSWORD: billing
    ports: ["5432:5432"]
    volumes: [postgres-data:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U billing -d billing"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7
    command: ["redis-server", "--appendonly", "yes"] # AOF: numbers survive a restart
    ports: ["6379:6379"]
    volumes: [redis-data:/data]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  kafka:
    image: apache/kafka:3.8.0 # KRaft mode, no Zookeeper
    ports: ["9092:9092", "29092:29092"] # host: localhost:9092 | kind pods: host.docker.internal:29092
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: INTERNAL://:19092,HOST://:9092,KIND://:29092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:19092,HOST://localhost:9092,KIND://host.docker.internal:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,HOST:PLAINTEXT,KIND:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      # Keep every message forever: the report service rebuilds its numbers by replaying the topics.
      KAFKA_LOG_RETENTION_MS: -1
    volumes: [kafka-data:/var/lib/kafka/data]
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:19092 > /dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 12

  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    ports: ["8090:8080"]
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:19092
    depends_on:
      kafka: { condition: service_healthy }

  mailpit:
    image: axllent/mailpit:latest # fake inbox: http://localhost:8025
    ports: ["8025:8025", "1025:1025"]

  # ---------- services ----------
  billing-service:
    build: ./services/billing
    ports: ["8080:8080"]
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/billing
      DB_USER: billing
      DB_PASSWORD: billing
      KAFKA_BOOTSTRAP: kafka:19092
      CORS_ORIGINS: http://localhost:5173
    depends_on:
      postgres: { condition: service_healthy }
      kafka: { condition: service_healthy } # the topics are created when this service starts

  notification-service:
    build: ./services/notification
    ports: ["3000:3000"]
    environment:
      KAFKA_BOOTSTRAP: kafka:19092
      SMTP_HOST: mailpit
      SMTP_PORT: 1025
      DB_PATH: /app/data/notifications.db
    volumes: [notification-data:/app/data]
    depends_on:
      kafka: { condition: service_healthy }
      mailpit: { condition: service_started }

  report-service:
    build: ./services/report
    ports: ["8000:8000"]
    environment:
      KAFKA_BOOTSTRAP: kafka:19092
      REDIS_URL: redis://redis:6379/0
      CORS_ORIGINS: http://localhost:5173
    depends_on:
      kafka: { condition: service_healthy }
      redis: { condition: service_healthy }

  dashboard:
    build:
      context: ./dashboard
      args:
        VITE_BILLING_URL: http://localhost:8080
        VITE_REPORT_URL: http://localhost:8000
    ports: ["5173:80"]
    depends_on: [billing-service, report-service]

volumes:
  postgres-data:
  redis-data:
  kafka-data:
  notification-data:
