# kind create cluster --name billing --config k8s/kind-config.yaml
# The extra port mappings make the NodePorts below reachable on the same localhost ports as in Docker Compose.
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
nodes:
  - role: control-plane
    extraPortMappings:
      - { containerPort: 30080, hostPort: 8080 } # billing-service
      - { containerPort: 30000, hostPort: 3000 } # notification-service
      - { containerPort: 30800, hostPort: 8000 } # report-service
      - { containerPort: 30173, hostPort: 5173 } # dashboard
