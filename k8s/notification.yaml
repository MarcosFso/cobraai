apiVersion: apps/v1
kind: Deployment
metadata:
  name: notification-service
spec:
  replicas: 1
  selector:
    matchLabels: { app: notification-service }
  template:
    metadata:
      labels: { app: notification-service }
    spec:
      containers:
        - name: notification-service
          image: notification-service:local
          imagePullPolicy: Never
          ports: [{ containerPort: 3000 }]
          envFrom:
            - configMapRef: { name: billing-config }
          env:
            - { name: DB_PATH, value: /app/data/notifications.db }
          volumeMounts:
            - { name: data, mountPath: /app/data }
          readinessProbe:
            httpGet: { path: /health, port: 3000 }
            periodSeconds: 5
          livenessProbe:
            httpGet: { path: /health, port: 3000 }
            initialDelaySeconds: 15
            periodSeconds: 10
          resources:
            requests: { memory: 96Mi, cpu: 50m }
            limits: { memory: 256Mi }
      volumes:
        - name: data
          emptyDir: {} # history is lost when the pod is recreated; use a PersistentVolumeClaim for more
---
apiVersion: v1
kind: Service
metadata:
  name: notification-service
spec:
  type: NodePort
  selector: { app: notification-service }
  ports: [{ port: 3000, targetPort: 3000, nodePort: 30000 }]
