apiVersion: apps/v1
kind: Deployment
metadata:
  name: report-service
spec:
  replicas: 1
  selector:
    matchLabels: { app: report-service }
  template:
    metadata:
      labels: { app: report-service }
    spec:
      containers:
        - name: report-service
          image: report-service:local
          imagePullPolicy: Never
          ports: [{ containerPort: 8000 }]
          envFrom:
            - configMapRef: { name: billing-config }
          readinessProbe:
            httpGet: { path: /health, port: 8000 }
            periodSeconds: 5
          livenessProbe:
            httpGet: { path: /health, port: 8000 }
            initialDelaySeconds: 15
            periodSeconds: 10
          resources:
            requests: { memory: 96Mi, cpu: 50m }
            limits: { memory: 256Mi }
---
apiVersion: v1
kind: Service
metadata:
  name: report-service
spec:
  type: NodePort
  selector: { app: report-service }
  ports: [{ port: 8000, targetPort: 8000, nodePort: 30800 }]
