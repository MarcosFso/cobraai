server:
  port: 8080
  # Behind a reverse proxy (Caddy) the request arrives as plain http. Trusting X-Forwarded-Proto/Host makes the browser's
  # same-origin requests (which carry an Origin header) count as same-origin, instead of failing with "Invalid CORS request".
  forward-headers-strategy: framework

spring:
  application:
    name: billing-service
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/billing}
    username: ${DB_USER:billing}
    password: ${DB_PASSWORD:billing}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none
    properties:
      hibernate.jdbc.time_zone: UTC
  flyway:
    enabled: true
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP:localhost:9092}
    producer:
      acks: all
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      properties:
        enable.idempotence: true
  jackson:
    default-property-inclusion: non_null

logging:
  structured:
    format:
      console: ecs

app:
  timezone: America/Sao_Paulo
  topics:
    partitions: 3
    invoice-events: invoice.events
  outbox:
    enabled: true
    poll-interval-ms: 2000
    batch-size: 50
  overdue:
    cron: "0 0 1 * * *"
  recurring:
    # monthly charges issue their next invoice this many days before it is due
    advance-days: 5
    cron: ${RECURRING_CRON:0 10 * * * *}
  cors:
    allowed-origins: ${CORS_ORIGINS:http://localhost:5173}
  jwt:
    # Shared with the report and notification services, which verify the same token. Set a long random value in production.
    secret: ${JWT_SECRET:dev-only-secret-change-me-0123456789abcdef}
    ttl-hours: ${JWT_TTL_HOURS:4}
  demo:
    max-age-hours: 24
    cleanup-cron: "0 15 * * * *"
  rate-limit:
    # per address and per minute, for the public auth endpoints (slows down password guessing and mass sign-ups)
    login-per-minute: 10
    register-per-minute: 10
    demo-per-minute: 20
